# File: .github/workflows/ci.yaml
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # 1. Linting & Formatting
  lint:
    name: Lint (Pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Python Dependencies
        run: uv sync --all-extras

      # Set up Node.js for frontend hooks (Prettier)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      # Install Node dependencies so hooks can find packages if needed
      - name: Install Node Dependencies
        run: npm ci

      - name: Verify Vendor Assets In Sync
        run: |
          npm run copy-vendor
          git diff --exit-code audiobook_automated/static/vendor/

      # Optimization: Cache pre-commit environments
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        run: uv run --all-extras pre-commit run --all-files --show-diff-on-failure

  # 2. Automated Python Tests
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run MyPy Type Check
        run: uv run --all-extras --python ${{ matrix.python-version }} mypy audiobook_automated tests

      - name: Run Tests
        env:
          SECRET_KEY: test-key
          SAVE_PATH_BASE: /tmp/test
        run: |
          uv run --all-extras --python ${{ matrix.python-version }} pytest --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml

  # 3. Automated JavaScript Tests
  js-test:
    name: Jest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install JS Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npx jest

  # 4. Verify Docker Build & Runtime Smoke Test
  docker-build:
    name: Docker Build & Smoke Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker Image
        run: docker build -t audiobookbay-automated:ci-test .

      - name: Test Container Startup (Smoke Test)
        run: |
          docker run -d --name smoke-test \
            -p 5078:5078 \
            -e SECRET_KEY=ci-smoke-test-key \
            -e SAVE_PATH_BASE=/tmp \
            audiobookbay-automated:ci-test

          # Give Gunicorn and entrypoint.sh time to boot
          sleep 5

          # Verify container is running and did not crash on startup
          if ! docker ps --filter "name=smoke-test" --filter "status=running" --format '{{.Names}}' | grep -q '^smoke-test$'; then
            echo "::error::Container failed to start or crashed on boot! Container logs:"
            docker logs smoke-test
            exit 1
          fi

          echo "Container started successfully. Logs:"
          docker logs smoke-test

          docker stop smoke-test
