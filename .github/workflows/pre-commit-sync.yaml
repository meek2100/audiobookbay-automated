# File: .github/workflows/pre-commit-sync.yaml
name: Dependabot Pre-Commit Sync

on:
  # Trigger when a PR is opened or updated
  pull_request:
    types: [opened, synchronize]
    # Filter to branches matching Dependabot's typical naming scheme
    branches:
      - "dependabot/**"
    paths:
      - "pyproject.toml"
      - "package.json"
      - ".github/workflows/*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # Required to create the Pull Request

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot's Branch
        uses: actions/checkout@v6
        with:
          # IMPORTANT: Checkout the head of the branch, not the default merge commit
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14" # Aligned with production baseline
          cache: "pip"

      - name: Install Python Development Dependencies
        # This installs pre-commit and Python linters (Ruff, MyPy, etc.)
        run: pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 # Use a stable Node version for CI
          cache: "npm"

      - name: Install Node Dependencies
        # Required for JavaScript hooks like Prettier to run correctly
        run: npm ci

      - name: Run pre-commit autoupdate
        # This command updates the 'rev' tags in .pre-commit-config.yaml
        run: pre-commit autoupdate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): synchronize pre-commit hooks"
          branch: "pre-commit-sync/${{ github.event.pull_request.head.ref }}"
          title: "chore(deps): update pre-commit hooks for #${{ github.event.pull_request.number }}"
          body: |
            This PR synchronizes `.pre-commit-config.yaml` following a dependency update.

            Triggered by PR: #${{ github.event.pull_request.number }}
          labels: |
            dependencies
            automerge
