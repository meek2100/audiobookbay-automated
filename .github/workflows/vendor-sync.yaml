# File: .github/workflows/vendor-sync.yaml
name: Vendor Sync

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-vendor-assets:
    # Only run for dependabot PRs or manual dispatch
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies and Copy Assets
        run: |
          npm ci
          npm run copy-vendor

      - name: Commit Updated Vendor Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(vendor): Sync compiled vendor assets"
          file_pattern: "audiobook_automated/static/vendor/**"
